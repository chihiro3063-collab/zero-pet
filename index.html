<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゼロそだて(仮)</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFF9EF;color:#3B2A1A;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:17px;line-height:1.6}
#app{max-width:480px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:22px;margin:4px 0 2px;text-align:center}
h2{font-size:18px;margin:24px 0 8px}
.sub{text-align:center;color:#8A7560;font-size:15px}
.petbox{background:#fff;border:2px solid #F0E2C8;border-radius:20px;margin:12px 0;padding:12px 0;text-align:center}
.type{text-align:center;font-size:20px;font-weight:bold;margin:4px 0}
.msg{text-align:center;color:#6B5640;margin:0 0 8px}
.gauge{height:18px;background:#F0E2C8;border-radius:9px;overflow:hidden;margin:6px 0}
.gauge div{height:100%;background:#7FC8B8}
.gauge.over div{background:#8E6BD1}
.row{display:flex;justify-content:space-between;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border-radius:14px;padding:2px 10px;font-size:15px;background:#fff;border:2px solid #F0E2C8}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;background:#F4C56B;color:#3B2A1A;font-weight:bold;width:100%;margin:6px 0;cursor:pointer}
button.sec{background:#fff;border:2px solid #F0E2C8}
button:disabled{opacity:.4}
button.small{width:auto;padding:4px 12px;font-size:14px;margin:0}
.card{background:#fff;border:2px solid #F0E2C8;border-radius:16px;padding:12px;margin:10px 0}
.notice{background:#EFE8FB;border-color:#C9B2F0}
input{font:inherit;width:100%;padding:12px;border:2px solid #F0E2C8;border-radius:12px;background:#fff;color:#3B2A1A}
label{display:block;font-size:15px;color:#6B5640;margin:10px 0 4px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cats button{margin:0;color:#3B2A1A}
.entry{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #F0E2C8;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv{background:#fff;border:2px solid #F0E2C8;border-radius:16px;padding:8px;text-align:center;font-size:15px}
.sv b{display:block;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #F0E2C8;display:flex;justify-content:center;gap:6px;padding:8px}
nav button{max-width:150px;margin:0;padding:10px 4px;background:#fff;font-size:15px}
nav button.on{background:#F4C56B}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#3B2A1A;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:16px}
#toast.on{opacity:1}
.note{font-size:15px;color:#8A7560}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<nav>
<button id="n_home" onclick="go('home')">育てる</button>
<button id="n_input" onclick="go('input')">食べさせる</button>
<button id="n_save" onclick="go('save')">保存</button>
</nav>
<input type="file" id="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)">
<script>
var KEY='zero_pet_v1';
var CATS=[
{k:'food',n:'食費',c:'#F4C56B',s:'#E0A63F'},
{k:'hobby',n:'趣味',c:'#F59AC0',s:'#E070A0'},
{k:'social',n:'交際費',c:'#8FD0F0',s:'#5FB0D8'},
{k:'daily',n:'日用品',c:'#A8D98A',s:'#7DBF63'},
{k:'other',n:'その他',c:'#C9B2F0',s:'#A98BDB'}
];
var RARE={
food:{n:'もぐもぐウイルス',s:2},
hobby:{n:'きらきらウイルス',s:3},
social:{n:'わいわいウイルス',s:3},
daily:{n:'こつこつウイルス',s:2},
other:{n:'ふしぎウイルス',s:3}
};
var GAMAN={n:'ぎゅっとがまん',s:3};
var STAGES=['たまご','ちび','こども','おとな'];
var screen='home';
var inputDate='';

function $(id){return document.getElementById(id)}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function yen(n){return '¥'+Math.round(n).toLocaleString('ja-JP')}
function monthLabel(m){var p=m.split('-');return parseInt(p[1],10)+'月'}
function catOf(k){for(var i=0;i<CATS.length;i++){if(CATS[i].k===k)return CATS[i]}return null}

function normalize(o){
  o=o||{};
  var d={v:1,budget:Number(o.budget)>0?Math.round(Number(o.budget)):100000,
    month:/^\d{4}-\d{2}$/.test(o.month)?o.month:ym(new Date()),
    entries:[],saved:[],lastBackup:typeof o.lastBackup==='string'?o.lastBackup.slice(0,10):null};
  (Array.isArray(o.entries)?o.entries:[]).forEach(function(e){
    if(e&&catOf(e.cat)&&Number(e.amount)>0&&typeof e.date==='string'){
      d.entries.push({date:e.date.slice(0,10),cat:e.cat,amount:Math.round(Number(e.amount))});
    }
  });
  (Array.isArray(o.saved)?o.saved:[]).forEach(function(s){
    if(s&&['balance','virus','gaman'].indexOf(s.type)>=0){
      d.saved.push({month:String(s.month||'').slice(0,7),type:s.type,dom:catOf(s.dom)?s.dom:'food',
        round:!!s.round,ears:s.ears==='big'?'big':'small',wings:!!s.wings,tail:!!s.tail,
        total:Number(s.total)||0,budget:Number(s.budget)||0});
    }
  });
  return d;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r))}catch(e){}
  return normalize({});
}
var data=load();
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(data))}
  catch(e){alert('この端末に保存できませんでした。バックアップをとっておいてください。')}
}

function stats(){
  var sums={},total=0,dom=null,max=0;
  CATS.forEach(function(c){sums[c.k]=0});
  data.entries.forEach(function(e){sums[e.cat]+=e.amount;total+=e.amount});
  CATS.forEach(function(c){if(sums[c.k]>max){max=sums[c.k];dom=c.k}});
  return {sums:sums,total:total,dom:dom};
}
function traits(st){
  function sh(k){return st.total?st.sums[k]/st.total:0}
  return {dom:st.dom||'food',round:sh('food')>=0.35,ears:sh('social')>=0.25?'big':'small',
    wings:sh('hobby')>=0.25,tail:sh('daily')>=0.25};
}
function typeLive(st){return st.total>data.budget?'virus':'balance'}
function typeFinal(st){
  if(st.total>data.budget)return 'virus';
  if(st.total<data.budget*0.5)return 'gaman';
  return 'balance';
}
function curWeek(){
  var now=new Date();
  if(data.month===ym(now))return Math.min(4,Math.ceil(now.getDate()/7));
  return 4;
}
function typeName(t){return t==='virus'?'ウイルス型(レア)':t==='gaman'?'がまん型(レア)':'バランス型'}
function rareInfo(t,dom){
  if(t==='virus')return RARE[dom]||RARE.other;
  if(t==='gaman')return GAMAN;
  return null;
}

function petSVG(p,stage,size){
  var s='';
  function R(x,y,w,h,c){s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>'}
  var cat=catOf(p.dom)||CATS[0];
  var DK='#3B2A1A';
  if(stage===0){
    R(5,2,6,1,'#F3E3C3');R(4,3,8,2,'#F3E3C3');R(3,5,10,6,'#F3E3C3');R(4,11,8,1,'#F3E3C3');R(5,12,6,1,'#F3E3C3');
    R(5,5,2,2,cat.c);R(9,8,2,2,cat.c);R(6,10,1,1,cat.c);
  }else{
    var body=cat.c,sh=cat.s;
    if(p.type==='virus'){body='#8E6BD1';sh='#6B4BB5'}
    if(p.type==='gaman'){body='#7FC8B8';sh='#5FB3A1'}
    var slim=p.type==='gaman',vir=p.type==='virus';
    if(stage>=3&&p.wings){
      R(0,3,1,1,'#8DB8E8');R(0,4,2,3,'#D6ECFF');R(1,7,1,1,'#8DB8E8');
      R(15,3,1,1,'#8DB8E8');R(14,4,2,3,'#D6ECFF');R(14,7,1,1,'#8DB8E8');
    }
    if(stage>=2&&p.tail){R(13,10,2,1,sh);R(14,8,1,3,sh)}
    if(stage>=2){
      if(slim){
        if(p.ears==='big'){R(3,0,2,4,sh);R(11,0,2,4,sh)}else{R(4,2,1,2,sh);R(11,2,1,2,sh)}
      }else{
        if(p.ears==='big'){R(1,0,3,4,sh);R(12,0,3,4,sh)}else{R(3,1,2,2,sh);R(11,1,2,2,sh)}
      }
    }
    if(vir){
      R(7,0,2,2,sh);R(1,6,2,2,sh);R(13,6,2,2,sh);R(7,12,2,2,sh);
      R(2,2,1,1,sh);R(13,2,1,1,sh);R(2,11,1,1,sh);R(13,11,1,1,sh);
      R(4,2,8,1,body);R(3,3,10,8,body);R(4,11,8,1,body);
      R(5,4,2,1,'#2D1B5E');R(9,4,2,1,'#2D1B5E');
      R(5,5,2,2,'#FFFFFF');R(9,5,2,2,'#FFFFFF');
      R(6,6,1,1,'#2D1B5E');R(9,6,1,1,'#2D1B5E');
      R(5,8,6,2,'#2D1B5E');R(6,8,1,1,'#FFFFFF');R(9,8,1,1,'#FFFFFF');
    }else if(slim){
      R(5,3,6,1,body);R(4,4,8,7,body);R(5,11,6,1,body);
      R(5,6,2,1,DK);R(9,6,2,1,DK);R(7,9,2,1,DK);
      R(12,4,1,2,'#5AA9E6');
      R(5,12,2,1,sh);R(9,12,2,1,sh);
    }else{
      if(p.round){R(4,2,8,1,body);R(2,3,12,1,body);R(1,4,14,6,body);R(2,10,12,1,body);R(4,11,8,1,body)}
      else{R(5,2,6,1,body);R(3,3,10,1,body);R(2,4,12,6,body);R(3,10,10,1,body);R(4,11,8,1,body)}
      R(5,5,1,2,DK);R(10,5,1,2,DK);
      R(3,8,2,1,'#F08A8A');R(11,8,2,1,'#F08A8A');
      R(7,8,2,1,DK);
      R(4,12,2,1,sh);R(10,12,2,1,sh);
    }
  }
  var k=[0.9,0.55,0.8,1][stage];
  return '<svg viewBox="0 0 16 16" width="'+size+'" height="'+size+'" shape-rendering="crispEdges"><g transform="translate(8 13) scale('+k+') translate(-8 -13)">'+s+'</g></svg>';
}
function stars(n){return '★★★'.slice(0,n)}

function go(s){screen=s;render();window.scrollTo(0,0)}
function toast(t){
  var e=$('toast');e.textContent=t;e.classList.add('on');
  clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},1800);
}

function render(){
  ['home','input','save'].forEach(function(k){$('n_'+k).className=(k===screen?'on':'')});
  var h='';
  if(screen==='home')h=viewHome();
  else if(screen==='input')h=viewInput();
  else h=viewSave();
  $('app').innerHTML=h;
}

function viewHome(){
  var st=stats(),week=curWeek(),stage=week-1;
  var type=typeLive(st),tr=traits(st);
  var p={type:type,dom:tr.dom,round:tr.round,ears:tr.ears,wings:tr.wings,tail:tr.tail};
  var pct=data.budget?Math.min(100,st.total/data.budget*100):0;
  var diff=data.budget-st.total;
  var over=st.total>data.budget;
  var msg=st.total===0?'まだ何も食べていないよ。食べさせてね。':
    over?'ウイルスになったよ。強いレアキャラだよ!':'いいかんじ。このまま育てよう。';
  var h='';
  if(data.month!==ym(new Date())){
    h+='<div class="card notice">'+monthLabel(data.month)+'がおわりました。この子を保存して、新しい月を始めよう。<button onclick="go(\'save\')">保存へ</button></div>';
  }
  h+='<h1>'+monthLabel(data.month)+'のキャラ</h1>';
  h+='<div class="sub">第'+week+'週 / 4 ・ '+STAGES[stage]+'</div>';
  h+='<div class="petbox">'+petSVG(p,stage,200)+'</div>';
  h+='<div class="type">'+typeName(type)+'</div>';
  h+='<div class="msg">'+msg+'</div>';
  h+='<div class="gauge'+(over?' over':'')+'"><div style="width:'+pct+'%"></div></div>';
  h+='<div class="row"><span>使った '+yen(st.total)+'</span><span>'+(over?'予算をこえた分 '+yen(-diff):'のこり '+yen(diff))+'</span></div>';
  h+='<div class="chips">';
  CATS.forEach(function(c){
    if(st.sums[c.k]>0)h+='<span class="chip" style="border-color:'+c.c+'">'+c.n+' '+yen(st.sums[c.k])+'</span>';
  });
  h+='</div>';
  h+='<button onclick="go(\'input\')">食べさせる</button>';
  if((data.entries.length||data.saved.length)&&needBackup()){
    h+='<div class="card note">バックアップをとっておくと安心です。<button class="sec" onclick="go(\'save\')">保存の画面へ</button></div>';
  }
  return h;
}
function needBackup(){
  if(!data.lastBackup)return true;
  var d=new Date(data.lastBackup+'T00:00:00');
  return (Date.now()-d.getTime())>14*86400000;
}

function monthRange(){
  var p=data.month.split('-'),y=parseInt(p[0],10),m=parseInt(p[1],10);
  var last=new Date(y,m,0).getDate();
  return {min:data.month+'-01',max:data.month+'-'+pad(last)};
}
function viewInput(){
  var r=monthRange(),today=ymd(new Date());
  if(!inputDate||inputDate<r.min||inputDate>r.max){
    inputDate=(today>=r.min&&today<=r.max)?today:r.min;
  }
  var h='<h1>食べさせる</h1>';
  h+='<div class="card"><label>'+monthLabel(data.month)+'の予算(円)</label>';
  h+='<input type="number" inputmode="numeric" id="budget" value="'+data.budget+'" onchange="setBudget(this.value)">';
  h+='<div class="note">ゼロたのの「毎月の生活費」と同じ金額を入れてね。</div></div>';
  h+='<div class="card"><label>日付</label><input type="date" id="dt" min="'+r.min+'" max="'+r.max+'" value="'+inputDate+'" onchange="inputDate=this.value">';
  h+='<label>金額(円)</label><input type="number" inputmode="numeric" id="amt" placeholder="例 1200">';
  h+='<label>何に使った?(タップで食べさせる)</label><div class="cats">';
  CATS.forEach(function(c){
    h+='<button style="background:'+c.c+'" onclick="addEntry(\''+c.k+'\')">'+c.n+'</button>';
  });
  h+='</div></div>';
  h+='<h2>最近の記録</h2><div class="card">';
  var list=data.entries.slice(-6).reverse();
  if(!list.length)h+='<div class="note">まだありません。</div>';
  list.forEach(function(e){
    var idx=data.entries.lastIndexOf(e);
    h+='<div class="entry"><span>'+e.date.slice(5).replace('-','/')+' '+catOf(e.cat).n+' '+yen(e.amount)+'</span><button class="small sec" onclick="delEntry('+idx+')">消す</button></div>';
  });
  h+='</div>';
  return h;
}
function setBudget(v){
  var n=Math.round(Number(v));
  if(n>0){data.budget=n;persist();toast('予算を変えたよ')}
  else{toast('1円以上を入れてね');render()}
}
function addEntry(cat){
  var n=Math.round(Number($('amt').value));
  var dt=$('dt').value||inputDate;
  if(!(n>0)){toast('金額を入れてね');return}
  var r=monthRange();
  if(dt<r.min||dt>r.max){toast('この月の日付を選んでね');return}
  inputDate=dt;
  data.entries.push({date:dt,cat:cat,amount:n});
  persist();render();
  toast('もぐもぐ! '+catOf(cat).n+' '+yen(n));
}
function delEntry(i){
  if(i<0)return;
  data.entries.splice(i,1);persist();render();
}

function viewSave(){
  var st=stats(),tr=traits(st),type=typeFinal(st),stage=3;
  var p={type:type,dom:tr.dom,round:tr.round,ears:tr.ears,wings:tr.wings,tail:tr.tail};
  var info=rareInfo(type,tr.dom);
  var h='<h1>保存</h1>';
  h+='<div class="card" style="text-align:center"><b>'+monthLabel(data.month)+'の子</b>';
  h+='<div>'+petSVG(p,stage,140)+'</div>';
  h+='<div class="type">'+typeName(type)+'</div>';
  if(info)h+='<div>'+info.n+' '+stars(info.s)+'</div>';
  h+='<div class="note">使った '+yen(st.total)+' / 予算 '+yen(data.budget)+'</div>';
  h+='<button onclick="doSave()"'+(st.total?'':' disabled')+'>この子を保存する</button>';
  h+='<div class="note">保存すると、記録をリセットして新しい月を始めます。</div></div>';
  h+='<h2>保存した子たち</h2>';
  if(!data.saved.length)h+='<div class="note">まだいません。</div>';
  h+='<div class="grid">';
  data.saved.forEach(function(s,i){
    var q={type:s.type,dom:s.dom,round:s.round,ears:s.ears,wings:s.wings,tail:s.tail};
    var inf=rareInfo(s.type,s.dom);
    h+='<div class="sv">'+petSVG(q,3,96)+'<b>'+(s.month?monthLabel(s.month):'')+' '+typeName(s.type)+'</b>';
    if(inf)h+='<div>'+inf.n+' '+stars(inf.s)+'</div>';
    h+='<button class="small sec" onclick="delSaved('+i+')">消す</button></div>';
  });
  h+='</div>';
  h+='<h2>バックアップ</h2><div class="card">';
  h+='<div class="note">データはこのスマホの中だけにあります。ときどきファイルに保存しておくと安心です。';
  h+=data.lastBackup?'(前回 '+data.lastBackup+')':'(まだ保存していません)';
  h+='</div>';
  h+='<button onclick="exportBackup()">ファイルに保存する</button>';
  h+='<button class="sec" onclick="$(\'file\').click()">ファイルから読み込む</button></div>';
  return h;
}
function doSave(){
  var st=stats();
  if(!st.total){toast('まだ食べていないよ');return}
  if(!confirm(monthLabel(data.month)+'の子を保存して、新しい月を始めます。いいですか?'))return;
  var tr=traits(st),type=typeFinal(st);
  data.saved.unshift({month:data.month,type:type,dom:tr.dom,round:tr.round,ears:tr.ears,wings:tr.wings,tail:tr.tail,total:st.total,budget:data.budget});
  data.entries=[];
  data.month=ym(new Date());
  persist();render();toast('保存したよ');
}
function delSaved(i){
  if(!confirm('この子を消します。いいですか?'))return;
  data.saved.splice(i,1);persist();render();
}
function exportBackup(){
  data.lastBackup=ymd(new Date());persist();
  var blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='zero_pet_backup_'+ymd(new Date()).replace(/-/g,'')+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  render();toast('ファイルに保存したよ');
}
function importBackup(inp){
  var f=inp.files&&inp.files[0];
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=normalize(JSON.parse(rd.result));
      if(!confirm('いまのデータを、このファイルの内容に置きかえます。いいですか?')){inp.value='';return}
      data=d;persist();render();toast('読み込んだよ');
    }catch(e){alert('このファイルは読み込めませんでした。')}
    inp.value='';
  };
  rd.readAsText(f);
}
render();
</script>
</body>
</html>
